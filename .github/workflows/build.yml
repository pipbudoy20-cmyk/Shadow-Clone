
name: Build Wukong Mod

on:
  workflow_dispatch:
  push:
    paths:
      - 'WukongCompact-main (1).zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract source ZIP
        run: |
          mkdir source
          unzip -q "WukongCompact-main (1).zip" -d source

      - name: Prepare Gradle
        run: |
          cd source/WukongCompact-main
          sed -i 's|mirrors.cloud.tencent.com/gradle/gradle-8.4-bin.zip|services.gradle.org/distributions/gradle-8.4-bin.zip|' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/-Xmx8G/-Xmx4G/' gradle.properties
          chmod +x gradlew

      - name: Build JAR
        run: |
          cd source/WukongCompact-main
          ./gradlew --no-daemon build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Wukong-Build
          path: source/WukongCompact-main/build/libs/*.jar
          
